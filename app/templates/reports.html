{% extends "base.html" %}
{% block content %}
<h1>Отчёты и рекомендации</h1>
<form method="post" action="/reports/generate" class="row inline">
  <button name="kind" value="rules">Автоотчёт по данным</button>
  <button name="kind" value="claude">Рекомендации Claude{% if not claude_ok %} (сохранит промпт){% endif %}</button>
</form>
<table><thead><tr><th>#</th><th>Отчёт</th><th>Тип</th><th>Создан</th></tr></thead><tbody>
{% for r in reports %}<tr><td>{{ r.id }}</td><td><a href="/reports/{{ r.id }}">{{ r.title }}</a></td><td>{{ r.kind }}</td><td>{{ r.created_at }}</td></tr>{% else %}<tr><td colspan="4" class="muted">Нет отчётов</td></tr>{% endfor %}
</tbody></table>
{% endblock %}
